<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculus Quiz Scores</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #667085;
    --line: #e4e7ec; --accent: #2f5bea; --accent-text: #fff; --bad: #c0362c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b1f27; --text: #e6e8ec; --muted: #98a2b3;
      --line: #2c323d; --accent: #6b8cff; --accent-text: #0b0e14; --bad: #ff7a6e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 520px; margin: 0 auto; padding: 40px 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: .9rem; }
  form { display: flex; gap: 8px; }
  input {
    flex: 1; min-width: 0; padding: 10px 12px; font-size: 1rem;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--text);
  }
  button {
    padding: 10px 18px; font-size: 1rem; border: 0; border-radius: 8px;
    background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  .msg { color: var(--bad); margin-top: 16px; }
  .card {
    margin-top: 24px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; overflow: hidden;
  }
  .card header { padding: 14px 16px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: .9rem; }
  .card header strong { color: var(--text); font-size: 1rem; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 10px 16px; border-bottom: 1px solid var(--line); }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: 0; }
  .na { color: var(--muted); }
  tfoot td { font-weight: 600; border-top: 2px solid var(--line); }
  footer { margin-top: 24px; color: var(--muted); font-size: .8rem; }
</style>
</head>
<body>
<main>
  <h1>Calculus Quiz Scores</h1>
  <p class="sub">Section 56 · Enter your student ID</p>

  <form id="f">
    <input id="sid" inputmode="numeric" autocomplete="off" placeholder="e.g. 6838040421" required>
    <button type="submit">Look up</button>
  </form>
  <div id="out"></div>
  <footer id="updated"></footer>
</main>

<script src="scores.js"></script>
<script>
  const D = window.SCORE_DATA;
  const out = document.getElementById("out");
  document.getElementById("updated").textContent =
    "Last updated " + D.updated + ". Each quiz is out of " + D.maxPerQuiz +
    " (0 = not submitted). Contact your instructor if something looks wrong.";

  document.getElementById("f").addEventListener("submit", e => {
    e.preventDefault();
    const id = document.getElementById("sid").value.replace(/\D/g, "");
    const s = D.scores[id];
    if (!s) {
      out.innerHTML = '<p class="msg">No record found for that ID. Please check and try again.</p>';
      return;
    }
    let total = 0, max = 0, rows = "";
    D.quizzes.forEach((q, i) => {
      const v = s[i];
      if (v === null) {
        rows += `<tr><td>${q.replace("Quiz", "Quiz ")}</td><td class="na">—</td></tr>`;
      } else {
        total += v; max += D.maxPerQuiz;
        rows += `<tr><td>${q.replace("Quiz", "Quiz ")}</td><td>${v} / ${D.maxPerQuiz}</td></tr>`;
      }
    });
    out.innerHTML = `
      <div class="card">
        <header>Student ID <strong>${id}</strong></header>
        <table>
          <tbody>${rows}</tbody>
          <tfoot><tr><td>Total</td><td>${total} / ${max}</td></tr></tfoot>
        </table>
      </div>`;
  });
</script>
</body>
</html>
